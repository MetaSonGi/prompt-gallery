/* ============ helpers ============ */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function parseVars(body){
  var vars=[], seen={};
  String(body).replace(/\{\{([^}]+)\}\}/g, function(m, v){
    v=v.trim(); if(v && !seen[v]){ seen[v]=1; vars.push(v); } return m;
  });
  return vars;
}
function fillVars(body, vals){
  return String(body).replace(/\{\{([^}]+)\}\}/g, function(m, v){
    v=v.trim(); return (vals[v]!==undefined && vals[v]!=="") ? vals[v] : m;
  });
}

/* ============ storage ============ */
function loadJSON(key, fb){
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; }
  catch(e){ return fb; }
}
function saveJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
var userPrompts = loadJSON("pg_user", []);
var favorites = loadJSON("pg_fav", []);

/* ============ state ============ */
var state = { cat:"all", q:"" };
function allPrompts(){
  return PROMPTS.concat(userPrompts);
}
function findPrompt(id){
  var all = allPrompts();
  for(var i=0;i<all.length;i++) if(all[i].id===id) return all[i];
  return null;
}
function isFav(id){ return favorites.indexOf(id)>=0; }

/* ============ toast ============ */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById("toast");
  t.textContent=msg; t.style.display="block";
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.style.display="none"; },2200);
}

/* ============ clipboard ============ */
function copyText(text, done){
  function ok(){ toast("📋 복사됐어요!"); if(done)done(); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok, function(){ fallback(); });
  } else fallback();
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ toast("복사에 실패했어요"); }
    document.body.removeChild(ta);
  }
}

/* ============ render: categories ============ */
function renderCats(){
  var nav=document.getElementById("cats");
  nav.innerHTML="";
  CATS.forEach(function(c){
    var b=document.createElement("button");
    b.textContent=c.name;
    if(c.id===state.cat) b.className="on";
    b.addEventListener("click", function(){ state.cat=c.id; renderCats(); renderGrid(); });
    nav.appendChild(b);
  });
}

/* ============ render: grid ============ */
function filtered(){
  var q=state.q.trim().toLowerCase();
  var all=allPrompts();
  return all.filter(function(p){
    if(state.cat==="fav" && !isFav(p.id)) return false;
    if(state.cat==="mine" && p.id.charAt(0)!=="u") return false;
    if(state.cat!=="all" && state.cat!=="fav" && state.cat!=="mine" && p.cat!==state.cat) return false;
    if(q){
      var hay=(p.title+" "+p.desc+" "+p.body).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}
function renderGrid(){
  var grid=document.getElementById("grid");
  var list=filtered();
  grid.innerHTML="";
  if(!list.length){
    var d=document.createElement("div");
    d.id="empty";
    d.textContent = state.cat==="fav" ? "⭐ 즐겨찾기한 프롬프트가 없어요." : "검색 결과가 없어요.";
    grid.appendChild(d); return;
  }
  list.forEach(function(p){
    var card=document.createElement("div");
    card.className="card";
    var vars=parseVars(p.body);
    card.innerHTML =
      '<span class="badge">'+esc(catName(p.cat))+'</span>'+
      '<h3>'+esc(p.title)+'</h3>'+
      '<p class="desc">'+esc(p.desc)+'</p>'+
      '<div class="row"></div>';
    var row=card.querySelector(".row");
    var useB=document.createElement("button");
    useB.className="primary"; useB.textContent="사용하기";
    useB.addEventListener("click", function(){ openUse(p.id); });
    var copyB=document.createElement("button");
    copyB.textContent="복사";
    copyB.addEventListener("click", function(){ copyText(p.body); });
    var starB=document.createElement("button");
    starB.className="star"+(isFav(p.id)?" on":"");
    starB.textContent=isFav(p.id)?"★":"☆";
    starB.title="즐겨찾기";
    starB.addEventListener("click", function(){
      toggleFav(p.id);
      starB.textContent=isFav(p.id)?"★":"☆";
      starB.classList.toggle("on", isFav(p.id));
      if(state.cat==="fav") renderGrid();
    });
    row.appendChild(useB); row.appendChild(copyB); row.appendChild(starB);
    if(p.id.charAt(0)==="u"){
      var editB=document.createElement("button");
      editB.textContent="✏️";
      editB.title="수정";
      editB.style.flex="0 0 44px";
      editB.addEventListener("click", function(){ openEdit(p.id); });
      row.appendChild(editB);
    }
    grid.appendChild(card);
  });
}
function toggleFav(id){
  var i=favorites.indexOf(id);
  if(i>=0){ favorites.splice(i,1); toast("즐겨찾기 해제"); }
  else { favorites.push(id); toast("⭐ 즐겨찾기에 추가"); }
  saveJSON("pg_fav", favorites);
}

/* ============ modal: use ============ */
var modalWrap, modal;
function openModal(html){
  modal.innerHTML=html;
  modalWrap.classList.add("show");
}
function closeModal(){ modalWrap.classList.remove("show"); }
function openUse(id){
  var p=findPrompt(id); if(!p) return;
  var vars=parseVars(p.body);
  var html='<h2>'+esc(p.title)+'</h2><div class="mdesc">'+esc(p.desc)+'</div>';
  if(vars.length){
    html+='<div id="varInputs">';
    vars.forEach(function(v,i){
      html+='<label class="lbl">'+esc(v)+'</label><input type="text" data-var="'+esc(v)+'" placeholder="'+esc(v)+' 입력">';
    });
    html+='</div>';
  } else {
    html+='<div class="mdesc">변수가 없는 프롬프트예요. 바로 복사해서 쓰세요.</div>';
  }
  html+='<label class="lbl">🔥 트렌드 스타일 <span style="font-weight:400;color:#999">(선택 시 프롬프트 뒤에 자동 추가)</span></label><div class="stylechips" id="styleChips"></div>';
  html+='<label class="lbl">미리보기</label><div id="preview"></div>';
  html+='<div class="mrow"><button id="mCopy" class="primary">📋 복사하기</button>'+
        '<button id="mFav">'+(isFav(p.id)?"★ 즐겨찾기 해제":"☆ 즐겨찾기")+'</button>'+
        '<button id="mClose">닫기</button></div>';
  openModal(html);
  var vals={};
  var selStyle=null;
  function styleText(){
    if(!selStyle) return "";
    for(var si=0;si<STYLES.length;si++)
      if(STYLES[si].id===selStyle) return "\n\n[트렌드 스타일 지시]\n"+STYLES[si].text;
    return "";
  }
  function refresh(){
    var filled=fillVars(p.body, vals)+styleText();
    var shown=esc(filled).replace(/\{\{([^}]+)\}\}/g, '<span class="var">{{$1}}</span>');
    document.getElementById("preview").innerHTML=shown;
    return filled;
  }
  var inputs=modal.querySelectorAll("[data-var]");
  for(var i=0;i<inputs.length;i++){
    (function(inp){
      inp.addEventListener("input", function(){ vals[inp.getAttribute("data-var")]=inp.value; refresh(); });
    })(inputs[i]);
  }
  var chipWrap=document.getElementById("styleChips");
  STYLES.forEach(function(s){
    var cb=document.createElement("button");
    cb.className="chip"; cb.textContent=s.name; cb.title=s.desc;
    cb.addEventListener("click", function(){
      selStyle=(selStyle===s.id)?null:s.id;
      var all=chipWrap.querySelectorAll(".chip");
      for(var k=0;k<all.length;k++) all[k].classList.remove("on");
      if(selStyle) cb.classList.add("on");
      refresh();
    });
    chipWrap.appendChild(cb);
  });
  refresh();
  document.getElementById("mCopy").addEventListener("click", function(){
    copyText(refresh());
  });
  document.getElementById("mFav").addEventListener("click", function(){
    toggleFav(p.id);
    document.getElementById("mFav").textContent=isFav(p.id)?"★ 즐겨찾기 해제":"☆ 즐겨찾기";
    renderGrid();
  });
  document.getElementById("mClose").addEventListener("click", closeModal);
}

/* ============ modal: add / edit ============ */
function openEdit(id){
  var p=id?findPrompt(id):null;
  var isNew=!p;
  var catOpts=CATS.filter(function(c){ return ["write","code","image","marketing","study","biz","life","sns"].indexOf(c.id)>=0; })
    .map(function(c){ return '<option value="'+c.id+'"'+(p&&p.cat===c.id?' selected':'')+'>'+esc(c.name)+'</option>'; }).join("");
  openModal(
    '<h2>'+(isNew?"＋ 내 프롬프트 추가":"✏️ 프롬프트 수정")+'</h2>'+
    '<div class="mdesc">본문에 {{변수명}}을 넣으면 사용 화면에서 입력 칸이 자동 생성돼요.</div>'+
    '<label class="lbl">제목</label><input type="text" id="fTitle" value="'+esc(p?p.title:"")+'" placeholder="예: 회의 안건 정리">'+
    '<label class="lbl">카테고리</label><select id="fCat">'+catOpts+'</select>'+
    '<label class="lbl">설명</label><input type="text" id="fDesc" value="'+esc(p?p.desc:"")+'" placeholder="한 줄 설명">'+
    '<label class="lbl">본문</label><textarea id="fBody" placeholder="프롬프트 본문… {{변수}} 사용 가능">'+esc(p?p.body:"")+'</textarea>'+
    '<div class="mrow"><button id="fSave" class="primary">💾 저장</button>'+
    (isNew?"":'<button id="fDel" class="danger">🗑 삭제</button>')+
    '<button id="fClose">취소</button></div>'
  );
  document.getElementById("fSave").addEventListener("click", function(){
    var title=document.getElementById("fTitle").value.trim();
    var body=document.getElementById("fBody").value.trim();
    if(!title){ toast("제목을 입력해 주세요"); return; }
    if(!body){ toast("본문을 입력해 주세요"); return; }
    var data={
      id: isNew ? "u"+Date.now() : p.id,
      cat: document.getElementById("fCat").value,
      title: title,
      desc: document.getElementById("fDesc").value.trim() || "내가 만든 프롬프트",
      body: body
    };
    if(isNew){ userPrompts.push(data); }
    else {
      for(var i=0;i<userPrompts.length;i++) if(userPrompts[i].id===p.id) userPrompts[i]=data;
    }
    saveJSON("pg_user", userPrompts);
    closeModal(); renderGrid();
    toast(isNew?"✅ 추가됐어요":"✅ 수정됐어요");
  });
  var delB=document.getElementById("fDel");
  if(delB) delB.addEventListener("click", function(){
    if(!confirm("정말 삭제할까요?")) return;
    userPrompts=userPrompts.filter(function(x){ return x.id!==p.id; });
    var fi=favorites.indexOf(p.id); if(fi>=0) favorites.splice(fi,1);
    saveJSON("pg_user", userPrompts); saveJSON("pg_fav", favorites);
    closeModal(); renderGrid(); toast("🗑 삭제됐어요");
  });
  document.getElementById("fClose").addEventListener("click", closeModal);
}

/* ============ optimizer ============ */
var VAGUE_WORDS=["잘","멋있게","적당히","대충","예쁘게","이쁘게","적절히","알아서","깔끔하게","좋게","적당하게","대략"];
function findVague(text){
  var found=[];
  String(text).split(/[\s,.\n!?~·:;()\[\]]+/).forEach(function(t){
    if(VAGUE_WORDS.indexOf(t)>=0 && found.indexOf(t)<0) found.push(t);
  });
  return found;
}
function diagnose(text){
  var t=String(text||"");
  var crit=[];
  var hasRole=/(너는|당신은|지금부터|로서|전문가|작가|선생님|컨설턴트|you are|act as)/i.test(t);
  crit.push({name:"역할 부여", pass:hasRole,
    tip:hasRole?"AI에게 역할을 부여했어요.":"\"너는 ~전문가야\"처럼 AI의 역할을 지정하면 답변 품질이 올라가요."});
  var vague=findVague(t);
  var specPass=(vague.length===0 && t.length>=30);
  crit.push({name:"구체성", pass:specPass,
    tip:specPass?"모호한 표현 없이 구체적이에요.":(vague.length?("모호한 표현 발견: "+vague.join(", ")+" → 구체적인 숫자·기준·예시로 바꿔보세요."):"요청이 너무 짧아 구체성이 부족해요.")});
  var hasFmt=/(형식|구조|목록|리스트|표로|마크다운|json|단락|분량|자 이내|글자|항목|순서|단계)/i.test(t);
  crit.push({name:"출력 형식 지정", pass:hasFmt,
    tip:hasFmt?"원하는 출력 형식을 지정했어요.":"\"3줄 요약\", \"표로 정리\"처럼 출력 형식을 지정하면 결과가 일정해져요."});
  var hasCtx=/(예시|예를 들어|맥락|배경|상황|참고|원문|\{\{[^}]+\}\}|```)/.test(t);
  crit.push({name:"예시·맥락 포함", pass:hasCtx,
    tip:hasCtx?"예시나 맥락(또는 {{변수}})이 포함됐어요.":"예시나 배경 상황을 함께 주면 AI가 의도를 정확히 파악해요."});
  var len=t.length;
  var lenPass=(len>=40 && len<=1500);
  crit.push({name:"적절한 길이", pass:lenPass,
    tip:lenPass?("적절한 길이에요 ("+len+"자)."):(len<40?("너무 짧아요 ("+len+"자). 필요한 정보를 더 채워보세요."):("너무 길어요 ("+len+"자). 핵심만 남기고 다듬어보세요."))});
  var score=0;
  crit.forEach(function(c){ if(c.pass) score+=20; });
  return {score:score, criteria:crit, len:len};
}
function improvePrompt(src){
  var t=String(src||"").trim();
  var out=[];
  if(!/(너는|당신은|로서|전문가|you are|act as)/i.test(t))
    out.push("너는 이 분야의 숙련된 전문가야. 아래 요청을 전문가 관점에서 처리해줘.");
  out.push("[요청]\n"+t);
  if(!/(형식|구조|목록|표로|마크다운|분량|자 이내)/i.test(t))
    out.push("[출력 형식]\n- 핵심 내용을 먼저 3~5개 bullet으로 정리\n- 이어서 상세 설명\n- 마지막에 한 줄 요약");
  var vague=findVague(t);
  if(vague.length)
    out.push("[주의] '"+vague.join(", ")+"' 같은 모호한 표현 대신 구체적인 숫자·기준·예시로 요청해줘.");
  if(!/(예시|예를 들어|맥락|배경|상황|참고|원문|\{\{[^}]+\}\}|```)/.test(t))
    out.push("[참고] 아래에 예시나 배경 정보를 추가하면 결과가 더 정확해져:\n(여기에 예시 입력)");
  return out.join("\n\n");
}
function runOpt(){
  var src=document.getElementById("optInput").value;
  if(!src.trim()){ toast("프롬프트를 먼저 붙여넣어 주세요"); return; }
  var d=diagnose(src);
  var res=document.getElementById("optResult");
  res.style.display="block";
  var color=d.score>=80?"#2d9e57":(d.score>=50?"#f5a301":"#d6336c");
  document.getElementById("optScore").innerHTML=
    '<div class="scorebig" style="color:'+color+'">'+d.score+'<span style="font-size:18px">/100</span></div>';
  var ul=document.getElementById("optCriteria");
  ul.innerHTML="";
  d.criteria.forEach(function(c){
    var li=document.createElement("li");
    li.className="crit "+(c.pass?"pass":"fail");
    li.innerHTML='<b>'+(c.pass?"✅ ":"❌ ")+esc(c.name)+'</b><span>'+esc(c.tip)+'</span>';
    ul.appendChild(li);
  });
  var imp=improvePrompt(src);
  document.getElementById("optImproved").textContent=imp;
  document.getElementById("optCopy").onclick=function(){ copyText(imp); };
  res.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function showTab(t){
  state.tab=t;
  document.getElementById("tabGallery").className=t==="gallery"?"on":"";
  document.getElementById("tabOpt").className=t==="opt"?"on":"";
  var g=(t==="gallery");
  document.getElementById("search").style.display=g?"":"none";
  document.getElementById("cats").style.display=g?"":"none";
  document.getElementById("grid").style.display=g?"":"none";
  document.getElementById("addBtn").style.display=g?"":"none";
  document.getElementById("optView").style.display=g?"none":"";
}

/* ============ init ============ */
function init(){
  modalWrap=document.getElementById("modalWrap");
  modal=document.getElementById("modal");
  renderCats(); renderGrid();
  document.getElementById("search").addEventListener("input", function(e){
    state.q=e.target.value; renderGrid();
  });
  document.getElementById("addBtn").addEventListener("click", function(){ openEdit(null); });
  document.getElementById("tabGallery").addEventListener("click", function(){ showTab("gallery"); });
  document.getElementById("tabOpt").addEventListener("click", function(){ showTab("opt"); });
  document.getElementById("optRun").addEventListener("click", runOpt);
  document.getElementById("optClear").addEventListener("click", function(){
    document.getElementById("optInput").value="";
    document.getElementById("optResult").style.display="none";
  });
  showTab("gallery");
  modalWrap.addEventListener("click", function(e){ if(e.target===modalWrap) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal(); });
}
if(typeof document!=="undefined" && document.getElementById){
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init);
  else init();
}

/* ============ test hooks (no effect on app) ============ */
if(typeof globalThis!=="undefined"){
  globalThis.__pgTest={ PROMPTS:PROMPTS, CATS:CATS, STYLES:STYLES, parseVars:parseVars, fillVars:fillVars, esc:esc, catName:catName, diagnose:diagnose, improvePrompt:improvePrompt, findVague:findVague };
}
